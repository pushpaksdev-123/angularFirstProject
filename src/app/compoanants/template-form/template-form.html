<div class="mt-2 p-2 bg-secondary text-white rounded">
    <h1>Templet form</h1>
    <p>using ngModel</p>
</div>

<form class="row g-3" #form="ngForm">
  <div class="col-md-4">
    <label  class="form-label">First name</label>
    <input type="text" name="firstName" #fname="ngModel" [(ngModel)]="studentObj.firstName" class="form-control", required minlength="3">
    <div class="text-danger">
      @if(fname.touched && fname.errors?.['required'])
      {
       <span>This is Required</span>
      }
      @else if(fname.touched && fname.errors?.['minlength']){
       <span>Min 3 char required</span>
      }
     
      
    </div>
  </div>
  <div class="col-md-4">
    <label  class="form-label">Last name</label>
    <input type="text" name="lastName" [(ngModel)]="studentObj.lastName" class="form-control">
    
  </div>
  <div class="col-md-4">
    <label class="form-label">Username</label>
    <div class="input-group">
      <span class="input-group-text">@</span>
      <input type="text"  name="userNamw" [(ngModel)]="studentObj.userNamw" class="form-control" >
      
    </div>
  </div>
  <div class="col-md-6">
    <label  class="form-label">City</label>
    <input type="text"  name="city" [(ngModel)]="studentObj.city" class="form-control">
    
  </div>
  <div class="col-md-3">
    <label  class="form-label">State</label>
    <select name="state" [(ngModel)]="studentObj.state" class="form-select" >
      <option selected disabled value="">Choose...</option>
      <option>Maharshtra</option>
      <option>Goa</option>
      <option>Punjab</option>
    </select>
  
  </div>
  <div class="col-md-3">
    <label class="form-label">Zip</label>
    <input type="text"  name="zipCode" [(ngModel)]="studentObj.zipCode" class="form-control">
 
  </div>
  <div class="col-12">
    <div class="form-check">
      <input name="isAcceptTerm" [(ngModel)]="studentObj.isAcceptTerm" class="form-check-input" type="checkbox" >
      <label class="form-check-label">
        Agree to terms and conditions
      </label>
      
    </div>
  </div>
  <div class="col-12">
     <button class="btn btn-secondary" type="reset" (click)="resetForm()">Reset form</button>
    <button class="btn btn-primary mx-2" type="submit" [disabled]="form.invalid" (click)="onSubmit()">Submit form</button>
  </div>
</form>

<div class="col-4">
    {{formValue | json}}
</div>
