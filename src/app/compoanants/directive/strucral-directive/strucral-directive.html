<div class="mt-2 p-2 bg-secondary text-white rounded">
    <h1>Structural Directive</h1>
    <p>*ngIf, *ngFor</p>
    <button class="btn btn-primary" (click)="navigateToAttributeDirective()">Go to Attribute Directive</button>
</div>
<div class="row pt-3">
    <div class="col-3">
        <div *ngIf="isDiv1Visible" class="bg-danger p-3 text center">
            <h4>Div-1</h4>
        </div>
    </div>
    <div class="col-3">
        <div *ngIf="isDiv2Visible" class="bg-success p-3 text center">
            <h4>Div-2</h4>
        </div>
    </div>
    <div class="col-3">
        <div *ngIf="num1==num2" class="bg-secondary p-3 text center">
            <h4>Div-3</h4>
        </div>
    </div>
    <div class="col-3">
        <div *ngIf="selectedCountry=='USA'" class="bg-primary p-3 text center">
            <h4>Div-4</h4>
        </div>
    </div>
  </div>
  <div class="row pt-3">
    <div class="col-3 text center">
        <button class="btn btn-danger" (click)="hideDiv1()">Hide</button>
        <button class="btn btn-primary mx-2" (click)="showDiv1()">Show</button>
    </div>
    <div class="col-3 text center">
        <button class="btn btn-success" (click)="toggleDiv2()">Toggle</button>
    </div>
    <div class="col-3 text center">
        <div style="display: flex;align-items: center;">
          <input type="text" class="form-control" [(ngModel)]="num1" placeholder="Num1">
          <input type="text" class="form-control" [(ngModel)]="num2" placeholder="Num2">
        </div>
        
    </div>
    <div class="col-3">
        <div style="display: flex;align-items: center;">
            <input type="checkbox" class="width-50">
            <select [(ngModel)]="selectedCountry">
                <option value="">Select Country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
            </select>
         </div>
    </div>

  </div>

  <div class="row">
    <div class="col-3">
            <ul>
                <li *ngFor="let city of cityList"><h2>{{city}}</h2></li>
            </ul>
    </div>
    <div class="col-3" >

    </div>
    <div class="col-3" >
      <select>
        <option *ngFor="let city of cityList" [value]="city">{{city}}</option>
      </select>
    </div>
    <div class="col-3" >
        <select>
        <option *ngFor="let student of studentList" [value]="student.studID">{{ student.name }}
            </option>
      </select>
    </div>

  </div>

  <div class="row">
    <div class="col-5">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Sr No</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>city</th>
            <th>Status </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of studentList; let i=index">
            <td>{{i+1}}</td>
            <td>{{student.name}}</td>
            <td>{{student.rollNo}}</td>
            <td>{{student.city}}</td>
            <td>
              <span *ngIf="student.isActive" class="badge bg-success">Active</span>
              <span *ngIf="!student.isActive" class="badge bg-danger">Inactive</span>
            </td>
          </tr>
        </tbody>
        </table>
    </div>
  </div>
