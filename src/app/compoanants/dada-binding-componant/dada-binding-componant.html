  <div class="row">
    <div class="col-md-4">
        <div class="row">
            <div class="col-md-4 bg-success">
                intrpolation
                <h4>{{ courseName }}</h4>
                <div>{{inputType}}</div>
                <input type="text" value="{{courseName}}" placeholder="Enter text here" /><br>
                <input type="{{inputType}}"/>
            </div>
            <div class="col-md-4 bg-warning">
                property binding
                <div [class]="myClassName">Danger</div>
                <h4>{{courseName}}</h4>
                <div>{{inputType}}</div>
                <input [value]="courseName" placeholder="Enter text here" /><br>
                <input [type]="inputType"/>
            </div>
            <div>
                    <button class="btn btn-success" (click)="showAlert('Button clicked!')">Click Me</button>
                    <span  (click)="showAlert('Span clicked!')">Click me</span>
                    <button class="btn btn-primary" (click)="changeCourseName()">Change Course Name</button>
            </div>
        </div>
    </div>

    <div class="col-md-6">
      <input type="text" [(ngModel)]="courseName"/>
      <select [(ngModel)]="stateName">
        <option value="">Select</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Goa">Goa</option>
        <option value="Punjab">Punjab</option>
      </select>
    </div>

    <div class="col-md-6">
      <h2> {{firstName()}} </h2>
      
    </div>
  </div>
